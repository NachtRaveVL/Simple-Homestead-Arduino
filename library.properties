sentence=Terraduino: Simple automation controller for homestead resource and environmental systems using Arduino-compatible microcontrollers.
paragraph=Provides reusable objects and control logic for rainwater harvesting, cisterns, wells, pumps, valves, water routing, thermal storage, circulation, weather and environmental sensing, scheduling, logging, data publishing, persistence, and optional remote sensor integration. Terraduino is designed to operate locally without an internet connection or cloud service. Networking and external transports can be added when required.
